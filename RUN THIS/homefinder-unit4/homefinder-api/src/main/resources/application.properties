# ---- Connection to the SAME database you created in Unit 3 ----
spring.datasource.url=jdbc:mysql://localhost:3306/homefinder
spring.datasource.username=root
spring.datasource.password=your_password_here

# Tables already exist (Unit 3), so Hibernate must not create or change them
spring.jpa.hibernate.ddl-auto=none

# Print the SQL that Spring runs (good for learning)
spring.jpa.show-sql=true

server.port=8080
