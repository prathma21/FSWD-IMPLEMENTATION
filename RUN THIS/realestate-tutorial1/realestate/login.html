<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | HomeFinder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <a class="logo" href="index.html">HomeFinder</a>
      <ul>
        <li><a href="index.html" >Home</a></li>
        <li><a href="listings.html" >Listings</a></li>
        <li><a href="contact.html" >Contact</a></li>
        <li><a href="login.html" class="active">Login</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h2>Login</h2>
    <form action="#" method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">

      <label for="role">I am a</label>
      <select id="role" name="role">
        <option value="buyer">Buyer / Renter</option>
        <option value="seller">Seller / Agent</option>
      </select>

      <button class="btn" type="submit">Login</button>
      <p>New here? <a href="contact.html">Contact us</a> to get an account.</p>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 HomeFinder. Built for Full Stack Development coursework.</p>
  </footer>
</body>
</html>
